<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 
      REMCO MAINTENANCE STANDBY PAGE
      To activate during site maintenance or updates:
      Add this snippet into <head> of index.html:
      <meta http-equiv="refresh" content="0; url=maintenance.html" />
      <script>window.location.replace("maintenance.html");</script>
    -->
    <title>Under Maintenance / Coming Soon | REMCO (International) Ltd</title>
    <meta name="description" content="REMCO (International) Ltd - Premier Air Conditioning & HVAC Solutions in Tanzania. Our website is undergoing scheduled maintenance." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Favicon / App Icons -->
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="apple-touch-icon" href="assets/logo.png" />

    <!-- Performance & Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#397441",
                        "navy": "#1F3A4A",
                        "carrier-blue": "#004595",
                        "toshiba-red": "#E4002B",
                        "background-light": "#f8fafc",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    }
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Subtle ambient glow */
        @keyframes pulseSoft {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.05); }
        }

        .ambient-glow {
            animation: pulseSoft 6s ease-in-out infinite;
        }

        /* Delicate background grid */
        .bg-light-grid {
            background-image: radial-gradient(rgba(31, 58, 74, 0.06) 1px, transparent 1px);
            background-size: 28px 28px;
        }
    </style>
</head>

<body class="bg-background-light text-navy min-h-screen flex flex-col justify-between items-center relative overflow-hidden selection:bg-primary selection:text-white px-6 py-10 sm:py-12">

    <!-- Background Decoration -->
    <div class="fixed inset-0 bg-light-grid pointer-events-none z-0"></div>
    <div class="fixed top-1/4 -left-32 w-80 h-80 bg-primary/10 rounded-full blur-3xl pointer-events-none ambient-glow"></div>
    <div class="fixed bottom-1/4 -right-32 w-80 h-80 bg-navy/10 rounded-full blur-3xl pointer-events-none ambient-glow" style="animation-delay: -3s;"></div>

    <!-- Top Spacer / Tag -->
    <div class="relative z-10 w-full flex justify-center">
        <span class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-[0.25em] bg-white text-navy/70 border border-gray-200/80 shadow-sm">
            <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
            REMCO (International) Ltd
        </span>
    </div>

    <!-- Centered Main Content: Logo & Coming Soon -->
    <main class="relative z-10 flex-grow flex items-center justify-center py-12 w-full">
        <div class="max-w-xl mx-auto w-full text-center flex flex-col items-center">

            <!-- Company Logo -->
            <div class="mb-10 sm:mb-12 p-8 sm:p-10 bg-white rounded-3xl shadow-xl shadow-gray-200/50 border border-gray-100 flex items-center justify-center transition-transform duration-300 hover:scale-[1.02]">
                <img src="assets/logo.png" alt="REMCO (International) Ltd" width="260" height="80" class="h-16 sm:h-20 w-auto object-contain" />
            </div>

            <!-- Coming Soon Title -->
            <h1 class="text-4xl sm:text-6xl font-black uppercase tracking-tight text-navy mb-4 leading-tight">
                Coming Soon
            </h1>

            <!-- Elegant Divider -->
            <div class="w-16 h-1 bg-primary rounded-full mb-6"></div>

            <!-- Subtitle Message -->
            <p class="text-base sm:text-lg text-gray-500 max-w-md mx-auto font-normal leading-relaxed">
                We are crafting a new digital experience. Check back soon.
            </p>

        </div>
    </main>

    <!-- Clean Footer -->
    <footer class="relative z-10 w-full text-center text-xs text-gray-400 font-medium">
        <p>© 2026 REMCO (International) Ltd. Official Carrier &amp; Toshiba Dealer in Tanzania.</p>
    </footer>

</body>

</html>
